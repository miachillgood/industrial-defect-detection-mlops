name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Pinned to the version the code was actually linted against locally --
      # a floating ruff turns a routine release into a red build.
      - run: pip install ruff==0.16.2
      - run: ruff check .

  test:
    name: Tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # The ImageNet checkpoint is 132 MB; caching keeps the backbone tests cheap.
      - name: Cache torch hub checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/torch/hub/checkpoints
          key: torchhub-wide_resnet50_2-v1

      - name: Install (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[serve,review,dev]"

      - name: Unit tests (no dataset required)
        run: pytest -m "not needs_data" --cov=src --cov-report=term-missing --cov-report=xml

      # The README's results table is generated from a run artifact, never
      # hand-written. If a full 15-category run is committed, they must agree.
      - name: README results table is in sync
        run: |
          results=$(find artifacts -name results.json 2>/dev/null | head -1)
          if [ -n "$results" ]; then
            python scripts/update_readme_results.py --check
          else
            echo "no committed results.json; skipping"
          fi

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: api
          push: false
          load: true
          tags: spade-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run -d --name spade-api -p 8000:8000 spade-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health; then ok=1; break; fi
            sleep 3
          done
          echo
          docker logs spade-api
          test "${ok:-0}" = "1"
          # No bank is mounted in CI, so /predict must 404 rather than crash.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -F 'file=@docs/assets/ci_probe.png' \
            'http://localhost:8000/predict?category=bottle')
          echo "predict without bank -> $code"
          test "$code" = "404"
          docker rm -f spade-api
