[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spade-mvtec-mlops"
version = "0.1.0"
description = "Unsupervised industrial surface-defect detection on MVTec AD, wrapped in an MLOps pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "scikit-image>=0.21",
    "pillow>=9.5",
    "tqdm>=4.65",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.9", "dvc>=3.30"]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "python-multipart>=0.0.9"]
review = ["streamlit>=1.49"]  # width="stretch" replaced use_container_width
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.26", "ruff>=0.4"]

[project.scripts]
spade-evaluate = "spade.evaluate:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "needs_data: requires the MVTec AD dataset on disk",
    "needs_backbone: loads ImageNet backbone weights (downloads on first run)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "apps", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"apps/**" = ["E402"]
"scripts/**" = ["E402"]
"src/spade/visualize.py" = ["E402"]
"tests/**" = ["E402"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]
